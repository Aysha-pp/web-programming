
<html>
<head>
<title>Registration form</title>
</head>
<body bgcolor="lightyellow">
<center>
<h2><b>Student Registration form</b></h2>
<form method="post" onsubmit=" return validateForm();">
<label>Name:</label>
<input type="text" name="name" id="name">
<br>
<br>
<label>Email:</label>
<input type="email" name="email" id="email">
<br>
<br>
<label>Password:</label>
<input type="password" name="password" id="password">
<br>
<br>
<label>Date of birth:</label>
<input type="date" name="dob" id="dob">
<br>
<br>
<label>Age:</label>
<input type="number" name="age" id="age">
<br>
<br>
<label>Gender:</label>
<input type="radio" name="gender" value="male">Male
<input type="radio" name="gender" value="female">Female
<br>
<br>
<label>Course:</label>
<select name="course" id="course">
<option>MCA</option>
<option>MBA</option>
<option>M.Tech</option>
</select>
<br>
<br>
<label>language:<label>
<input type="checkbox" name="language" value="english">English
<input type="checkbox" name="language" value="malayalam">Malayalam
<input type="checkbox" name="language" value="french">French
<br>
<br>
<label>Address:<label><br>
<textarea name="address" rows="4" cols="30"></textarea>
<br>
<br>
<input type="submit" value="Register">
<input type="reset" value="clear">
</form>
<script>
function validateForm()
{
var name=document.getElementById("name").value;
var email=document.getElementById("email").value;
var password=document.getElementById("password").value;
var dob=document.getElementById("dob").value;
var age=document.getElementById("age").value;
var gender=document.getElementsByName("gender");
var course=document.getElementById("course").value;
var language=document.getElementsByName("language");
var address=document.getElementsByName("address");
var msg=""
var selected=false;
var genderSelected=false;
if(name=="")
{
msg+= "enter your name\n";
}
if(email=="")
{
msg += "enter your email\n";
}
if(password=="")
{
msg += "enter your password\n";
}
if(age=="")
{
msg += "enter your age\n";
}
if(dob=="")
{
msg += "enter your date of birth\n";
}
if(course=="")
{
msg += "select your course\n";
}

for(i=0;i<gender.length;i++)
{
    if(gender[i].checked)
    {
        genderSelected=true;
    }
}
if(genderSelected == false)
    {
        msg += "Select your gender\n";
    }
if(address=="")
{
msg += "enter your address\n";
}
for(i=0;i<language.length;i++)
{
if(language[i].checked)
{
selected=true
}
}
if(selected==false)
{
msg+="select atleast one"
}
if (msg!="")
{
alert(msg);
return false;
}
else
{
alert("successfully registered")
return true;
}
}
</script>
</center>
</body>
</html>
